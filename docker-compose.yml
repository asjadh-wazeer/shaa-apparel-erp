version: '3.9'

# ============================================================
# SHAA Apparel ERP — Docker Compose (Development)
# ============================================================

networks:
  erp-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

services:
  # ----------------------------------------------------------
  # MySQL Database
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shaa-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DATABASE_NAME:-shaa_erp_db}
      MYSQL_USER: ${DATABASE_USER:-erp_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-erp_password}
    ports:
      - '${DATABASE_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - erp-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DATABASE_ROOT_PASSWORD:-root_password}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # Redis Cache & Queue
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shaa-erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - erp-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # MinIO Object Storage
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: shaa-erp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    networks:
      - erp-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # ----------------------------------------------------------
  # NestJS Backend API
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: shaa-erp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${DATABASE_USER:-erp_user}:${DATABASE_PASSWORD:-erp_password}@mysql:3306/${DATABASE_NAME:-shaa_erp_db}
      REDIS_HOST: redis
      QUEUE_REDIS_HOST: redis
      MINIO_ENDPOINT: minio
    ports:
      - '${APP_PORT:-3001}:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

  # ----------------------------------------------------------
  # React Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: shaa-erp-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${APP_PORT:-3001}/api/v1
      VITE_WS_URL: http://localhost:${APP_PORT:-3001}
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - erp-network

  # ----------------------------------------------------------
  # Nginx Reverse Proxy
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: shaa-erp-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - erp-network
